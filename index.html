<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Clock - Ilman Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap');
        
        :root {
            --primary: #6366f1;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05);
        }

        .dark .glass-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .clock-ring {
            position: relative;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: conic-gradient(from 0deg, var(--primary), #a855f7, var(--primary));
            padding: 4px;
            animation: rotate-gradient 10s linear infinite;
        }

        @keyframes rotate-gradient {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .clock-face {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 50%;
            position: relative;
            transform: rotate(-0deg); /* Counter-rotate core */
        }

        .dark .clock-face {
            background: #0f172a;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            border-radius: 20px;
            transition: transform 0.1s cubic-bezier(0.4, 2.3, 0.3, 1);
        }

        .hand-hour { width: 8px; height: 70px; background: #1e293b; z-index: 3; }
        .hand-min { width: 5px; height: 110px; background: #64748b; z-index: 2; }
        .hand-sec { width: 2px; height: 130px; background: #ef4444; z-index: 4; }
        
        .dark .hand-hour { background: #f1f5f9; }

        .search-input {
            background: rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        .dark .search-input {
            background: rgba(30, 41, 59, 0.5);
        }

        .search-input:focus {
            ring: 2px;
            ring-color: var(--primary);
            background: white;
        }

        .dark .search-input:focus {
            background: #1e293b;
        }

        .branding-text {
            background: linear-gradient(to right, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
    </style>
</head>
<body class="bg-[#f8fafc] dark:bg-[#020617] text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
        
        <!-- Kolom Kiri: Jam Visual -->
        <div class="lg:col-span-5 flex flex-col items-center justify-center space-y-10">
            <div class="relative group">
                <!-- Outer Glow -->
                <div class="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-full blur opacity-25 group-hover:opacity-50 transition duration-1000"></div>
                
                <div class="clock-ring">
                    <div class="clock-face shadow-inner flex items-center justify-center">
                        <div class="absolute w-4 h-4 bg-red-500 rounded-full z-50 shadow-lg border-2 border-white dark:border-slate-900"></div>
                        <div id="hour-h" class="hand hand-hour"></div>
                        <div id="min-h" class="hand hand-min"></div>
                        <div id="sec-h" class="hand hand-sec"></div>
                        
                        <!-- Number Indicators -->
                        <div class="absolute top-6 font-bold text-slate-300 dark:text-slate-700">12</div>
                        <div class="absolute right-6 font-bold text-slate-300 dark:text-slate-700">3</div>
                        <div class="absolute bottom-6 font-bold text-slate-300 dark:text-slate-700">6</div>
                        <div class="absolute left-6 font-bold text-slate-300 dark:text-slate-700">9</div>
                    </div>
                </div>
            </div>
            
            <div class="text-center space-y-2">
                <div class="flex items-center justify-center space-x-3">
                    <span class="px-3 py-1 rounded-full bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 text-xs font-bold uppercase tracking-widest">Digital Live</span>
                </div>
                <h2 id="digital-clock" class="text-7xl font-black font-mono tracking-tighter bg-clip-text text-transparent bg-gradient-to-b from-slate-900 to-slate-600 dark:from-white dark:to-slate-400">00:00:00</h2>
                <p id="current-date" class="text-xl text-slate-500 font-medium tracking-tight">Memuat kalender...</p>
            </div>
        </div>

        <!-- Kolom Kanan: Kontrol & Informasi -->
        <div class="lg:col-span-7 space-y-8">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h3 class="text-sm font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-widest mb-1">Global Time Services</h3>
                    <h1 class="text-4xl font-extrabold tracking-tight">Smart Clock <span class="branding-text">Ilman Studio</span></h1>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="toggleTheme()" class="w-12 h-12 flex items-center justify-center rounded-2xl glass-card hover:scale-110 transition-all">
                        <i id="theme-icon" class="fas fa-moon text-indigo-500"></i>
                    </button>
                    <button onclick="initLocationDetection()" class="w-12 h-12 flex items-center justify-center rounded-2xl glass-card hover:scale-110 transition-all text-emerald-500">
                        <i class="fas fa-location-crosshairs"></i>
                    </button>
                </div>
            </div>

            <!-- Pencarian Lokasi Manual -->
            <div class="relative group">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fas fa-search text-slate-400"></i>
                </div>
                <input type="text" id="city-search" placeholder="Cari kota di seluruh dunia (ex: Tokyo, New York)..." 
                       class="w-full pl-11 pr-32 py-5 rounded-3xl glass-card search-input outline-none focus:ring-2 ring-indigo-500/50 font-medium"
                       onkeypress="handleSearch(event)">
                <button onclick="searchManual()" class="absolute right-3 top-2 bottom-2 px-6 rounded-2xl bg-indigo-600 text-white font-bold text-sm hover:bg-indigo-700 transition-colors">
                    Cari
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Info Box 1 -->
                <div class="glass-card p-6 rounded-3xl group hover:border-indigo-500/50 transition-all cursor-default">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-2xl bg-indigo-500/10 flex items-center justify-center text-indigo-500 group-hover:scale-110 transition-transform">
                            <i class="fas fa-map-marked-alt text-xl"></i>
                        </div>
                        <div>
                            <p class="text-[10px] uppercase font-black text-slate-400 tracking-widest">Region</p>
                            <p id="location-name" class="font-bold text-lg truncate">Mendeteksi...</p>
                        </div>
                    </div>
                </div>

                <!-- Info Box 2 -->
                <div class="glass-card p-6 rounded-3xl group hover:border-purple-500/50 transition-all cursor-default">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-2xl bg-purple-500/10 flex items-center justify-center text-purple-500 group-hover:scale-110 transition-transform">
                            <i class="fas fa-clock text-xl"></i>
                        </div>
                        <div>
                            <p class="text-[10px] uppercase font-black text-slate-400 tracking-widest">Timezone</p>
                            <p id="timezone" class="font-bold text-lg font-mono">--:--</p>
                        </div>
                    </div>
                </div>
            </div>

            <div id="status-panel" class="p-4 rounded-2xl bg-emerald-500/5 border border-emerald-500/20 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div id="status-dot" class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></div>
                    <span id="status-text" class="text-sm font-semibold text-emerald-600 dark:text-emerald-400">Sistem Berjalan Normal</span>
                </div>
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Powered by Ilman Studio &bull; v2.0 Premium</span>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-8 right-8 px-6 py-3 rounded-2xl bg-slate-900 text-white shadow-2xl transform translate-y-24 transition-transform duration-300 flex items-center space-x-3 z-[100]">
        <i class="fas fa-info-circle text-indigo-400"></i>
        <span id="toast-msg" class="text-sm font-medium"></span>
    </div>

    <script>
        const state = {
            isDark: false,
            currentTimezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            manualOffset: 0,
            isManual: false
        };

        function updateClock() {
            const now = new Date();
            
            // Handle manual timezone offset if needed
            let displayDate = now;
            if (state.isManual) {
                // Konversi waktu saat ini ke UTC, lalu tambah offset zona target
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                displayDate = new Date(utc + (3600000 * state.manualOffset));
            }

            const seconds = displayDate.getSeconds();
            const minutes = displayDate.getMinutes();
            const hours = displayDate.getHours();

            // Analog Logic
            const secDeg = (seconds / 60) * 360;
            const minDeg = ((minutes / 60) * 360) + ((seconds / 60) * 6);
            const hourDeg = ((hours % 12) / 12 * 360) + ((minutes / 60) * 30);

            document.getElementById('sec-h').style.transform = `translateX(-50%) rotate(${secDeg}deg)`;
            document.getElementById('min-h').style.transform = `translateX(-50%) rotate(${minDeg}deg)`;
            document.getElementById('hour-h').style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;

            // Digital Logic
            const h = String(hours).padStart(2, '0');
            const m = String(minutes).padStart(2, '0');
            const s = String(seconds).padStart(2, '0');
            document.getElementById('digital-clock').innerText = `${h}:${m}:${s}`;

            // Date Logic
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').innerText = displayDate.toLocaleDateString('id-ID', options);
        }

        async function initLocationDetection() {
            showToast("Mendeteksi lokasi anda...");
            state.isManual = false;
            
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        const { latitude, longitude } = pos.coords;
                        try {
                            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=10`);
                            const data = await res.json();
                            const city = data.address.city || data.address.town || data.address.state || "Lokasi Anda";
                            document.getElementById('location-name').innerText = city + ", " + (data.address.country || "");
                            state.currentTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                            document.getElementById('timezone').innerText = state.currentTimezone;
                            showToast("Lokasi sinkron!");
                        } catch(e) { fetchFallback(); }
                    },
                    () => fetchFallback()
                );
            } else {
                fetchFallback();
            }
        }

        async function fetchFallback() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                document.getElementById('location-name').innerText = data.city + ", " + data.country_name;
                document.getElementById('timezone').innerText = data.timezone;
            } catch(e) {
                document.getElementById('location-name').innerText = "Jakarta, Indonesia";
            }
        }

        function handleSearch(e) {
            if (e.key === 'Enter') searchManual();
        }

        async function searchManual() {
            const query = document.getElementById('city-search').value;
            if (!query) return;

            showToast(`Mencari ${query}...`);
            try {
                // Gunakan WorldTimeAPI atau sejenisnya. Untuk demo premium, kita gunakan Geocoding + TimeZone API gabungan sederhana
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?q=${query}&format=json&limit=1`);
                const geoData = await geoRes.json();

                if (geoData.length > 0) {
                    const loc = geoData[0];
                    document.getElementById('location-name').innerText = loc.display_name.split(',')[0] + ", " + loc.display_name.split(',').pop().trim();
                    
                    // Simulasi deteksi zona waktu (Dibutuhkan API berbayar untuk presisi tinggi, 
                    // namun di sini kita gunakan pendekatan estimasi berdasarkan bujur longitude)
                    const lon = parseFloat(loc.lon);
                    const estimatedOffset = Math.round(lon / 15);
                    
                    state.isManual = true;
                    state.manualOffset = estimatedOffset;
                    document.getElementById('timezone').innerText = `GMT ${estimatedOffset >= 0 ? '+' : ''}${estimatedOffset}:00 (Estimasi)`;
                    
                    showToast("Lokasi diperbarui manual");
                    document.getElementById('city-search').value = "";
                } else {
                    showToast("Kota tidak ditemukan!");
                }
            } catch(e) {
                showToast("Gagal mencari lokasi");
            }
        }

        function toggleTheme() {
            state.isDark = !state.isDark;
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (state.isDark) {
                html.classList.add('dark');
                icon.className = 'fas fa-sun text-yellow-400';
            } else {
                html.classList.remove('dark');
                icon.className = 'fas fa-moon text-indigo-500';
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('translate-y-24');
            setTimeout(() => toast.classList.add('translate-y-24'), 3000);
        }

        window.onload = () => {
            setInterval(updateClock, 1000);
            updateClock();
            initLocationDetection();
            
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) toggleTheme();
        };
    </script>
</body>
</html>
