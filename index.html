<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IlmanStudio Premium Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 10px;
        }
        /* Typing animation */
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        /* Markdown minimal formatting */
        .message-content p { margin-bottom: 0.5rem; }
        .message-content p:last-child { margin-bottom: 0; }
        .message-content strong { font-weight: 600; color: #fbbf24; }
        .message-content code { background: #1f2937; padding: 0.1rem 0.3rem; border-radius: 0.25rem; font-family: monospace; font-size: 0.875em; }
        .message-content pre { background: #111827; padding: 0.75rem; border-radius: 0.5rem; overflow-x: auto; margin-top: 0.5rem; margin-bottom: 0.5rem;}
        .message-content pre code { background: transparent; padding: 0; color: #e5e7eb; }
        
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen w-full overflow-hidden text-gray-100">

    <!-- Mobile App Container -->
    <div class="w-full h-full max-w-md bg-gray-900 flex flex-col relative shadow-2xl sm:h-[90vh] sm:rounded-3xl sm:border border-gray-800 overflow-hidden">
        
        <!-- App Header -->
        <header class="bg-gray-950/80 backdrop-blur-md px-4 py-3 flex items-center justify-between border-b border-gray-800 z-10">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center shadow-lg shadow-amber-500/20">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
                    </div>
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-gray-950 rounded-full"></div>
                </div>
                <div>
                    <h1 class="font-bold text-gray-100 text-lg leading-tight tracking-wide">IlmanStudio</h1>
                    <p class="text-xs text-amber-500 font-medium">Auto-Connect Premium</p>
                </div>
            </div>
            <button class="p-2 rounded-full hover:bg-gray-800 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
            </button>
        </header>

        <!-- Chat Area -->
        <main id="chat-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjMTExODIzIj48L3JlY3Q+CjxyZWN0IHdpZHRoPSIxIiBoZWlnaHQ9IjEiIGZpbGw9IiMxZjI5MzciPjwvcmVjdD4KPC9zdmc+')] bg-repeat">
            
            <!-- Welcome Message -->
            <div class="flex items-end gap-2 max-w-[85%] self-start animate-fade-in">
                <div class="w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center flex-shrink-0 border border-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-amber-400"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
                </div>
                <div class="bg-gray-800/90 backdrop-blur-sm border border-gray-700 text-gray-200 p-3 rounded-2xl rounded-bl-sm shadow-sm message-content text-sm">
                    Halo! Selamat datang di <strong>IlmanStudio Premium</strong>. Sistem sekarang menggunakan koneksi otomatis yang aman tanpa perlu memasukkan API Key secara manual. Ada yang bisa saya bantu?
                </div>
            </div>

        </main>

        <!-- Input Area -->
        <footer class="bg-gray-950 px-4 py-3 border-t border-gray-800 pb-safe">
            <form id="chat-form" class="flex items-end gap-2">
                <div class="flex-1 bg-gray-800 border border-gray-700 rounded-3xl flex items-center px-4 py-2 focus-within:border-amber-500 focus-within:ring-1 focus-within:ring-amber-500 transition-all">
                    <input 
                        type="text" 
                        id="message-input" 
                        class="w-full bg-transparent text-gray-100 placeholder-gray-500 outline-none text-sm py-1"
                        placeholder="Ketik pesan Anda..."
                        autocomplete="off"
                        required
                    >
                </div>
                <button 
                    type="submit" 
                    id="send-button"
                    class="w-11 h-11 rounded-full bg-gradient-to-r from-amber-500 to-yellow-500 flex items-center justify-center text-gray-900 shadow-lg hover:opacity-90 active:scale-95 transition-all flex-shrink-0 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transform: translateX(-1px);"><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </form>
        </footer>
    </div>

    <script>
        // --- KONFIGURASI API (Sistem Otomatis) ---
        const apiKey = ""; // Ditinggalkan kosong, sistem Canvas akan menyuntikkan kunci otomatis saat runtime.
        const MODEL_NAME = "gemini-2.5-flash-preview-09-2025"; 
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;

        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');

        const systemPrompt = "Anda adalah asisten virtual premium dari IlmanStudio. Anda profesional, membantu, dan ramah. Gunakan bahasa Indonesia yang baik. Jawab ringkas dan jelas. Nama studio ini adalah IlmanStudio.";

        function parseMarkdown(text) {
            let html = text;
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/\n/g, '<br>');
            return html;
        }

        function scrollToBottom() {
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
        }

        function appendUserMessage(text) {
            const html = `
                <div class="flex items-end gap-2 max-w-[85%] self-end animate-fade-in">
                    <div class="bg-gradient-to-r from-amber-500 to-amber-600 text-gray-950 p-3 rounded-2xl rounded-br-sm shadow-md text-sm">
                        ${text}
                    </div>
                </div>`;
            chatContainer.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
        }

        function appendBotMessage(text, isLoading = false, id = null) {
            const messageId = id ? `id="${id}"` : '';
            const content = isLoading 
                ? `<div class="flex gap-1 py-1"><div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div><div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div><div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div></div>`
                : `<div class="message-content text-sm">${parseMarkdown(text)}</div>`;

            const html = `
                <div ${messageId} class="flex items-end gap-2 max-w-[85%] self-start animate-fade-in">
                    <div class="w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center flex-shrink-0 border border-gray-700">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-amber-400"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
                    </div>
                    <div class="bg-gray-800/90 backdrop-blur-sm border border-gray-700 text-gray-200 p-3 rounded-2xl rounded-bl-sm shadow-sm overflow-hidden">
                        ${content}
                    </div>
                </div>`;
            
            if (id) {
                const existingMsg = document.getElementById(id);
                if (existingMsg) existingMsg.remove();
            }

            chatContainer.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
        }

        async function fetchGeminiResponse(userText) {
            const payload = {
                contents: [{ parts: [{ text: userText }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            const maxRetries = 5;
            const delay = (ms) => new Promise(res => setTimeout(res, ms));

            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();

                    if (!response.ok) throw new Error(data.error?.message || `Status ${response.status}`);

                    if (data.candidates && data.candidates[0].content) {
                        return data.candidates[0].content.parts[0].text;
                    }
                    return "Maaf, sistem tidak dapat memberikan jawaban.";

                } catch (error) {
                    if (i === maxRetries - 1) return "Gagal terhubung ke server. Silakan coba lagi.";
                    await delay(1000 * Math.pow(2, i));
                }
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            appendUserMessage(text);
            messageInput.value = '';
            messageInput.disabled = true;
            sendButton.disabled = true;

            const loadingId = 'loading-' + Date.now();
            appendBotMessage('', true, loadingId);

            const botResponse = await fetchGeminiResponse(text);
            appendBotMessage(botResponse, false, loadingId);

            messageInput.disabled = false;
            sendButton.disabled = false;
            messageInput.focus();
        });
    </script>
</body>
</html>
