<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jam Modern & Deteksi Lokasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@500&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.5s ease;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .dark .glass {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .clock-outer {
            position: relative;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 8px solid currentColor;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            border-radius: 10px;
            transition: transform 0.05s cubic-bezier(0.4, 2.08, 0.55, 0.44);
        }

        .hour-hand { width: 6px; height: 60px; background: currentColor; }
        .min-hand { width: 4px; height: 90px; background: currentColor; opacity: 0.8; }
        .sec-hand { width: 2px; height: 100px; background: #ef4444; }

        .pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
        
        <!-- Bagian Visual Jam -->
        <div class="flex flex-col items-center justify-center space-y-6">
            <div class="clock-outer border-slate-200 dark:border-slate-800 shadow-2xl bg-white dark:bg-slate-900">
                <div class="absolute w-3 h-3 bg-red-500 rounded-full z-10"></div>
                <div id="hour" class="hand hour-hand"></div>
                <div id="minute" class="hand min-hand"></div>
                <div id="second" class="hand sec-hand"></div>
                
                <!-- Markings -->
                <div class="absolute inset-0 p-4 flex items-start justify-center font-bold opacity-20 text-xl">12</div>
                <div class="absolute inset-0 p-4 flex items-center justify-end font-bold opacity-20 text-xl">3</div>
                <div class="absolute inset-0 p-4 flex items-end justify-center font-bold opacity-20 text-xl">6</div>
                <div class="absolute inset-0 p-4 flex items-center justify-start font-bold opacity-20 text-xl">9</div>
            </div>
            
            <div class="text-center">
                <h2 id="digital-clock" class="text-6xl font-extrabold font-mono tracking-tighter">00:00:00</h2>
                <p id="current-date" class="text-lg text-slate-500 mt-2 font-medium">Memuat tanggal...</p>
            </div>
        </div>

        <!-- Bagian Informasi Lokasi -->
        <div class="glass p-8 rounded-3xl shadow-xl space-y-6">
            <div>
                <h1 class="text-3xl font-bold mb-2">Waktu Lokal</h1>
                <p class="text-slate-500 dark:text-slate-400">Deteksi otomatis berdasarkan lokasi perangkat Anda.</p>
            </div>

            <div class="space-y-4">
                <div class="flex items-center space-x-4 p-4 rounded-2xl bg-white/50 dark:bg-white/5 border border-slate-200 dark:border-slate-700">
                    <div class="bg-blue-500/10 p-3 rounded-xl text-blue-500">
                        <i class="fas fa-map-marker-alt text-xl"></i>
                    </div>
                    <div>
                        <p class="text-xs uppercase tracking-wider font-bold text-slate-400">Lokasi</p>
                        <p id="location-name" class="font-semibold italic">Menunggu izin lokasi...</p>
                    </div>
                </div>

                <div class="flex items-center space-x-4 p-4 rounded-2xl bg-white/50 dark:bg-white/5 border border-slate-200 dark:border-slate-700">
                    <div class="bg-purple-500/10 p-3 rounded-xl text-purple-500">
                        <i class="fas fa-globe-asia text-xl"></i>
                    </div>
                    <div>
                        <p class="text-xs uppercase tracking-wider font-bold text-slate-400">Zona Waktu</p>
                        <p id="timezone" class="font-semibold font-mono">--:--</p>
                    </div>
                </div>

                <div id="weather-card" class="hidden flex items-center space-x-4 p-4 rounded-2xl bg-gradient-to-br from-orange-400/10 to-red-500/10 border border-orange-200 dark:border-orange-900/30">
                    <div class="text-orange-500 p-3 rounded-xl">
                        <i id="weather-icon" class="fas fa-sun text-2xl"></i>
                    </div>
                    <div>
                        <p class="text-xs uppercase tracking-wider font-bold text-slate-400">Status Lingkungan</p>
                        <p id="weather-desc" class="font-semibold text-orange-600 dark:text-orange-400 italic">Menganalisis...</p>
                    </div>
                </div>
            </div>

            <div class="pt-4 border-t border-slate-200 dark:border-slate-800 flex justify-between items-center text-sm">
                <span class="flex items-center text-slate-500">
                    <span id="status-dot" class="w-2 h-2 bg-yellow-500 rounded-full mr-2"></span> <span id="status-text">Meminta Izin</span>
                </span>
                <button onclick="toggleTheme()" class="p-2 px-4 rounded-full bg-slate-200 dark:bg-slate-800 hover:scale-105 transition-transform active:scale-95">
                    <i id="theme-icon" class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Inisialisasi State
        const state = {
            isDark: false
        };

        // Fungsi Jam Digital & Analog
        function updateClock() {
            const now = new Date();
            
            // Jam Analog
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();

            const secDeg = ((seconds / 60) * 360);
            const minDeg = ((minutes / 60) * 360) + ((seconds/60)*6);
            const hourDeg = ((hours / 12) * 360) + ((minutes/60)*30);

            document.getElementById('second').style.transform = `translateX(-50%) rotate(${secDeg}deg)`;
            document.getElementById('minute').style.transform = `translateX(-50%) rotate(${minDeg}deg)`;
            document.getElementById('hour').style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;

            // Jam Digital
            const h = String(hours).padStart(2, '0');
            const m = String(minutes).padStart(2, '0');
            const s = String(seconds).padStart(2, '0');
            document.getElementById('digital-clock').innerText = `${h}:${m}:${s}`;

            // Tanggal
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').innerText = now.toLocaleDateString('id-ID', options);
        }

        // Fungsi Utama untuk Deteksi Lokasi dengan Izin Browser
        function initLocationDetection() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    // Jika user mengizinkan
                    async (position) => {
                        const { latitude, longitude } = position.coords;
                        updateStatus('Aktif', 'bg-green-500');
                        await reverseGeocode(latitude, longitude);
                    },
                    // Jika user menolak atau error
                    (error) => {
                        console.warn("Izin ditolak atau error, beralih ke deteksi IP.");
                        updateStatus('Terbatas (IP)', 'bg-blue-500');
                        fetchLocationByIP();
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            } else {
                fetchLocationByIP();
            }
        }

        // Mendapatkan nama tempat berdasarkan koordinat (OpenStreetMap Nominatim)
        async function reverseGeocode(lat, lon) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10&addressdetails=1`);
                const data = await response.json();
                
                const city = data.address.city || data.address.town || data.address.village || data.address.state || "Lokasi Tidak Dikenal";
                const country = data.address.country || "";
                
                document.getElementById('location-name').innerText = `${city}, ${country}`;
                
                // Zona waktu berdasarkan standar browser untuk lokasi saat ini
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                document.getElementById('timezone').innerText = tz;

                updateWeatherUI();
            } catch (error) {
                fetchLocationByIP();
            }
        }

        // Fallback: Deteksi Lokasi via IP
        async function fetchLocationByIP() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                
                document.getElementById('location-name').innerText = `${data.city}, ${data.country_name}`;
                document.getElementById('timezone').innerText = `${data.timezone} (${data.utc_offset})`;
                updateWeatherUI();
            } catch (error) {
                document.getElementById('location-name').innerText = "Gagal mendeteksi lokasi";
            }
        }

        function updateWeatherUI() {
            const hour = new Date().getHours();
            const isNight = hour < 6 || hour > 18;
            
            const weatherCard = document.getElementById('weather-card');
            const weatherIcon = document.getElementById('weather-icon');
            const weatherDesc = document.getElementById('weather-desc');
            
            weatherCard.classList.remove('hidden');
            if (isNight) {
                weatherIcon.className = 'fas fa-moon text-2xl';
                weatherDesc.innerText = 'Suasana Malam';
                if (!state.isDark) setTheme(true);
            } else {
                weatherIcon.className = 'fas fa-sun text-2xl';
                weatherDesc.innerText = 'Suasana Siang';
            }
        }

        function updateStatus(text, colorClass) {
            const dot = document.getElementById('status-dot');
            const label = document.getElementById('status-text');
            dot.className = `w-2 h-2 rounded-full mr-2 ${colorClass}`;
            label.innerText = text;
        }

        // Manajemen Tema
        function toggleTheme() {
            setTheme(!state.isDark);
        }

        function setTheme(isDark) {
            state.isDark = isDark;
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            
            if (isDark) {
                html.classList.add('dark');
                icon.className = 'fas fa-sun';
            } else {
                html.classList.remove('dark');
                icon.className = 'fas fa-moon';
            }
        }

        // Event Listeners
        window.onload = () => {
            setInterval(updateClock, 1000);
            updateClock();
            initLocationDetection();

            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                setTheme(true);
            }
        };
    </script>
</body>
</html>
